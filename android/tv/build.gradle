apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// Ofisteki TV'ye (Xiaomi Mi TV Stick) kurulan "Sita Yapı TV" uygulaması —
// masaüstündeki "TV'de Yayınla" butonunun gönderdiği ürünü tam ekran gösterir.
// Supabase adresi ve anahtarı git'e girmeyen tv/supabase.properties
// dosyasından okunur (bkz. tv/supabase.properties.example). TV'ye SADECE
// "publishable" (anon) anahtar konmalı — "sb_secret_" anahtarı tüm veritabanına
// tam yetki verir; release derlemesi bu yüzden onu reddeder.
def supabaseProps = new Properties()
def supabasePropsFile = file('supabase.properties')
if (supabasePropsFile.exists()) supabasePropsFile.withInputStream { supabaseProps.load(it) }
def supabaseUrl = supabaseProps.getProperty('url', '')
def supabaseKey = supabaseProps.getProperty('key', '')

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path.startsWith(':tv:') && it.name.toLowerCase().contains('release') } && supabaseKey.startsWith('sb_secret_')) {
        throw new GradleException("tv/supabase.properties içinde gizli (sb_secret_) anahtar var — TV'ye publishable anahtar konmalı.")
    }
}

android {
    namespace = "com.vitra.sitayapitv"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vitra.sitayapitv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_KEY", "\"${supabaseKey}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            // Mi Stick'e ADB ile elle kuruluyor, mağazaya gitmiyor — ayrı bir
            // imza anahtarı yönetmemek için debug imzası kullanılıyor.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // Sürümler :app ile aynı tutuldu — yeni indirme gerektirmeden derlensin.
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // :app'te Capacitor bu ikisini daha yeni sürüme çekiyor; aynı sürümler
    // seçilsin ki önbellekteki kütüphanelerle (çevrimdışı) derlenebilsin.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat-resources:$androidxAppCompatVersion"
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // YouTube oynatıcısı için WebView'i masaüstü tarayıcı olarak tanıtmak (VideoScreen.kt).
    implementation 'androidx.webkit:webkit:1.14.0'
    // Animasyonlu hava durumu ikonları (Meteocons Lottie dosyaları, assets/meteocons).
    implementation 'com.airbnb.android:lottie-compose:6.4.0'
}
