apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace = "com.vitra.sitaservisplanlayici"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vitra.sitaservisplanlayici"
        // java.time (randevu tarihleri) Android 8.0 / API 26 gerektiriyor — 24'te Android 7 telefonda
        // tarih ekranları çöküyordu. TV modülü ortak değeri (24) kullanmaya devam ediyor.
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Google Maps anahtarı git'e girmez (depo herkese açık): android/local.properties
        // içindeki MAPS_API_KEY'den okunur, manifestteki ${MAPS_API_KEY} yerine yazılır.
        def localProps = new Properties()
        def localFile = rootProject.file('local.properties')
        if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
        manifestPlaceholders = [MAPS_API_KEY: localProps.getProperty('MAPS_API_KEY', '')]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Play Store yükleme anahtarı (upload key): iCloud DIŞINDA ~/.sita-android/
    // upload-keystore.jks; şifre Mac Anahtar Zinciri'nde ("sita-android-upload").
    // scripts/build-android-release.sh şifreyi ortam değişkenine koyup derler —
    // anahtar ve şifre depoya ASLA girmez. Google Play App Signing açık olduğu için
    // bu anahtar kaybolursa Play Console'dan sıfırlanabilir.
    signingConfigs {
        release {
            def ks = System.getenv("SITA_UPLOAD_KEYSTORE") ?: "${System.getProperty('user.home')}/.sita-android/upload-keystore.jks"
            def pw = System.getenv("SITA_UPLOAD_STORE_PASSWORD")
            if (pw && file(ks).exists()) {
                storeFile file(ks)
                storePassword pw
                keyAlias "upload"
                keyPassword pw
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ---- Native Kotlin/Compose app (iOS SwiftUI app'in Android karşılığı) ----
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'

    // ---- Kamera ile barkod okuma (CameraX + ML Kit) ----
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ---- Harita (Google Maps) ----
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.maps.android:maps-compose:4.3.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ---- Push Bildirimleri (Firebase Cloud Messaging) — google-services.json
    // eklenip aşağıdaki plugin bloğu etkinleşene kadar token hiç üretilmez,
    // FcmService sessizce hiçbir şey yapmaz (uygulama çökmez).
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
